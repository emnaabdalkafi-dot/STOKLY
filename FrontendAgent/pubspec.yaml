name: frontend_agent
description: A new Flutter project for STOKLY Agents.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.1.0
  shared_preferences: ^2.2.0
  provider: ^6.0.5
  image_picker: ^1.2.1
  mobile_scanner: ^5.0.0
  dart_pusher_channels: ^1.2.3
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^7.1.1
  timeago: ^3.7.1
  flutter_local_notifications: ^17.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
