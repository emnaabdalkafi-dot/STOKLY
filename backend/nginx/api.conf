server {
       root /home/emna/backend/public;
       server_name tinnipax.api.azartech.io;
       client_max_body_size 200M;

       # Serve uploaded public files (avatars, exports, etc.) directly — no PHP
       location /storage/ {
           alias /home/emna/backend/storage/app/public/;
           try_files $uri =404;
           access_log off;
           expires 30d;
       }

       location / {
           try_files $uri /index.php$is_args$args;
       }

       location /app {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
       }

       location ~ ^/index\.php(/|$) {
        if ($request_method !~ ^(GET|POST|HEAD|OPTIONS|PUT|PATCH|DELETE)$) {
            return 400;
        }
         fastcgi_pass unix:/run/php/php8.2-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;

            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
         }


        listen 443 ssl; # managed by Certbot
        ssl_certificate /etc/letsencrypt/live/tinnipax.api.azartech.io/fullchain.pem; # managed by Certbot
        ssl_certificate_key /etc/letsencrypt/live/tinnipax.api.azartech.io/privkey.pem; # managed by Certbot
        include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
